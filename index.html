<!DOCTYPE html>
<html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurul Hayat Academy 2017</title><script src="https://cdn.tailwindcss.com"></script><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script></head><body class="bg-slate-50"><div class="bg-gradient-to-r from-indigo-600 to-blue-600 text-white p-4 text-center"><h1 class="font-bold text-xl">Nurul Hayat Academy 2017 | PLAZA CORE FRESH</h1><p class="text-xs">✅ Secure Cloud - ilimi hasken rayiwa - Affiliate 15008273991</p></div><div class="max-w-4xl mx-auto p-4"><div id="status" class="bg-white p-3 rounded shadow text-xs mb-4 border-l-4 border-yellow-500">Connecting...</div><div class="bg-white rounded-xl shadow p-5"><h2 class="font-bold">Live Students</h2><div id="list" class="mt-3">Loading...</div><button onclick="loadStudents()" class="mt-3 bg-indigo-600 text-white px-4 py-2 rounded">Refresh</button><hr class="my-4"><input id="n" placeholder="Name" class="w-full border p-2 rounded mt-2"><input id="e" placeholder="Email" class="w-full border p-2 rounded mt-2"><input id="p" placeholder="Phone" class="w-full border p-2 rounded mt-2"><input id="c" placeholder="Course" class="w-full border p-2 rounded mt-2"><button onclick="addStudent()" class="mt-3 w-full bg-green-600 text-white py-3 rounded-xl font-bold">Save to Cloud</button></div></div><script>
const db = supabase.createClient('https://rltzyqqieonretsocass.supabase.co','sb_publishable_5XTeRsdLkPNVNxADAvg0pQ_YYR0Mn3e');
async function loadStudents(){
  try{
    const {data,error} = await db.from('students').select('*').order('id',{ascending:false});
    if(error){document.getElementById('status').innerHTML='❌ '+error.message+'<br>Go to Supabase SQL Editor and run RLS policy!';return;}
    document.getElementById('status').innerHTML='✅ Connected! '+data.length+' Students LIVE from Secure Cloud!';
    document.getElementById('list').innerHTML=data.map(s=>`<div class="border-b py-2">🎓 <b>${s.name}</b> - ${s.course} - ${s.phone}</div>`).join('') || 'No students yet';
  }catch(err){document.getElementById('status').innerHTML='❌ Fetch failed: '+err.message;}
}
async function addStudent(){
  const {error} = await db.from('students').insert([{name:n.value,email:e.value,phone:p.value,course:c.value}]);
  if(error) alert('❌ '+error.message+' - Run RLS SQL!'); else {alert('✅ Saved to cloud!');loadStudents();}
}
loadStudents();
</script></body></html>
