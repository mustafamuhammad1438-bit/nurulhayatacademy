<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nurul Hayat Academy</title><script src="https://cdn.tailwindcss.com"></script></head><body class="bg-slate-50"><div class="bg-indigo-600 text-white p-4 text-center font-bold">Nurul Hayat Academy 2017 | PLAZA CORE FRESH - LIVE</div><div class="max-w-4xl mx-auto p-4"><div id="status" class="bg-yellow-100 border-l-4 border-yellow-600 p-4 rounded">Connecting to https://rltzyqqieonretsocass.supabase.co ...</div><div id="list" class="mt-4 bg-white p-4 rounded shadow">Loading...</div><div class="mt-4 bg-white p-4 rounded shadow"><input id="n" placeholder="Name" class="w-full border p-2 rounded mt-2"><input id="e" placeholder="Email" class="w-full border p-2 rounded mt-2"><input id="p" placeholder="Phone" class="w-full border p-2 rounded mt-2"><input id="c" placeholder="Course" class="w-full border p-2 rounded mt-2"><button onclick="addStudent()" class="mt-3 w-full bg-green-600 text-white py-3 rounded-xl font-bold">Save to Cloud</button></div></div><script>
const PROJECT_URL='https://rltzyqqieonretsocass.supabase.co';
const PUBLISHABLE_KEY='sb_publishable_5XTeRsdLkPNVNxADAvg0pQ_YYR0Mn3e';
async function load(){
 try{
  const res=await fetch(PROJECT_URL+'/rest/v1/students?select=*',{headers:{apikey:PUBLISHABLE_KEY,Authorization:'Bearer '+PUBLISHABLE_KEY}});
  const txt=await res.text(); if(!res.ok){document.getElementById('status').innerHTML='❌ Error '+res.status+':<br><pre>'+txt+'</pre>';return;}
  const data=JSON.parse(txt); document.getElementById('status').innerHTML='✅ CONNECTED! '+data.length+' students LIVE!'; document.getElementById('list').innerHTML=data.map(s=>'<div class="border-b py-2">🎓 <b>'+s.name+'</b> - '+s.course+' - '+s.phone+'</div>').join('')||'No students yet';
 }catch(e){document.getElementById('status').innerHTML='❌ Fetch failed: '+e.message+'<br>If DNS error, try mobile data or VPN - some ISPs block supabase.co';}
}
async function addStudent(){const body={name:n.value,email:e.value,phone:p.value,course:c.value}; const res=await fetch(PROJECT_URL+'/rest/v1/students',{method:'POST',headers:{apikey:PUBLISHABLE_KEY,Authorization:'Bearer '+PUBLISHABLE_KEY,'Content-Type':'application/json','Prefer':'return=representation'},body:JSON.stringify(body)}); if(!res.ok){const t=await res.text(); alert('Error: '+t);}else{alert('Saved!'); load();}}
load();
</script></body></html>
