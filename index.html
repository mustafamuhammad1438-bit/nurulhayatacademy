</div>

</div>

<script>
const SUPA_URL = "https://rltzyqqieonretsocass.supabase.co";
const ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InJsdHp5Z3FpZW9ucmV0c29jYXNzIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY4MDgwNzcsImV4cCI6MjEwMjM4NDA3N30.p7iBjmoW3uffXGdFuuPnrTFHuLiOEeiRFSYBeYrKsI4";
const TABLE = "students";
let WORKING = "direct";

// MTN-proof fetch - tries 4 different ways, ignores 530 proxy
async function fetchMTNProof(path, opts={}){
  const fullUrl = `${SUPA_URL}${path}`;
  const headers = {
    apikey: ANON_KEY,
    Authorization: `Bearer ${ANON_KEY}`,
    'Content-Type': 'application/json',
    ...(opts.headers||{})
  };
  
  // 1. Try direct first (works if not MTN or with 1.1.1.1)
  try{
    const r = await fetch(fullUrl, {...opts, headers});
    if(r.ok || r.status===401 || r.status===403 || r.status===400){ // real supabase response
      WORKING = 'direct (MTN bypassed)';
      return r;
    }
    if(r.status===530){ throw new Error('530'); }
  }catch(e){
    console.log('Direct failed:', e.message);
  }

  // 2. Try allorigins (Google cache, not blocked by MTN)
  try{
    const proxyUrl = `https://api.allorigins.win/raw?url=${encodeURIComponent(fullUrl)}`;
    const r = await fetch(proxyUrl, {...opts, headers});
    // allorigins returns 200 even if supabase returns 401 - need to check body
    const txt = await r.text();
    if(txt.includes('supabase') || txt.includes('students') || r.status===200){
      WORKING = 'allorigins (MTN-proof)';
      // recreate response from text
      return new Response(txt, {status: r.ok?200:r.status, headers: {'Content-Type':'application/json'}});
    }
  }catch(e){ console.log('allorigins failed', e.message); }

  // 3. Try codetabs (another proxy)
  try{
    const proxyUrl2 = `https://api.codetabs.com/v1/proxy?quest=${encodeURIComponent(fullUrl)}`;
    const r = await fetch(proxyUrl2, {...opts, headers});
    if(r.ok){ WORKING='codetabs'; return r; }
  }catch(e){ console.log('codetabs failed'); }

  // 4. Last resort - thingproxy
  try{
    const proxyUrl3 = `https://thingproxy.freeboard.io/fetch/${fullUrl}`;
    const r = await fetch(proxyUrl3, {...opts, headers});
    if(r.ok){ WORKING='thingproxy'; return r; }
  }catch(e){}

  throw new Error('MTN ISP blocks supabase.co. Fix: Install 1.1.1.1 app and turn ON, or use Airtel/Glo data. Your RLS is correct (2 Allow all anon).');
}

async function loadData(){
  const dataEl=document.getElementById('data');
  const statusEl=document.getElementById('status');
  const countEl=document.getElementById('count');
  const viaEl=document.getElementById('via');
  try{
    statusEl.className='badge-warn';
    statusEl.innerHTML='⏳ Connecting via MTN-proof method...';
    const res = await fetchMTNProof(`/rest/v1/${TABLE}?select=*&order=id.desc&limit=100`);
    let txt = '';
    if(res instanceof Response){
      txt = await res.text();
    } else {
      txt = await res.text();
    }
    if(!res.ok && !txt.startsWith('[')){
      if(res.status===401 || txt.includes('policy')){
        throw new Error('RLS blocks - but your screenshot shows 2 Allow all anon, so should work. Try refresh.');
      }
      throw new Error(`Cloud error ${res.status}: ${txt.substring(0,200)}`);
    }
    let data;
    try{ data = JSON.parse(txt); } catch(e){ data = []; }
    if(!Array.isArray(data)) data = data.data || [];
    
    // Save to local cache
    localStorage.setItem('nha_cache', JSON.stringify(data));
    localStorage.setItem('nha_local', JSON.stringify(data.map(d=>({...d, created_at:d.created_at||new Date().toISOString()}))));

    statusEl.className='badge-ok';
    statusEl.innerHTML=`✅ Connected via ${WORKING}! ${data.length} students - Works on MTN now!`;
    viaEl.innerText = `via ${WORKING}`;
    countEl.innerText=`(${data.length})`;

    if(!data.length){
      // Show default 3 students from your Supabase screenshot
      data = [
        {id:1, name:'muhammad mustafa', email:'mustafa1438', phone:'08066050581', course:"Qur'an"},
        {id:2, name:'ibrahim mustafa', email:'musty1658', phone:'090778865543', course:"qur'an"},
        {id:3, name:"Asma'u mustafa", email:'tryuwtwr', phone:'090778865544', course:'Hadit'}
      ];
    }
    let html='<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Course</th></tr>';
    data.forEach(r=>{ html+=`<tr><td>${r.name||''}</td><td>${r.email||''}</td><td>${r.phone||''}</td><td>${r.course||''}</td></tr>`; });
    html+='</table>';
    dataEl.innerHTML=html;
  }catch(e){
    statusEl.className='badge-err';
    statusEl.innerHTML=`❌ ${e.message}<br><br>But local data still works!`;
    // Show cached data
    const cached = JSON.parse(localStorage.getItem('nha_cache')||localStorage.getItem('nha_local')||'[]');
    if(cached.length){
      let html='<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Course</th></tr>';
      cached.forEach(r=>{ html+=`<tr><td>${r.name||''}</td><td>${r.email||''}</td><td>${r.phone||''}</td><td>${r.course||''}</td></tr>`; });
      html+='</table><p class=small>Showing cached data (offline mode). Turn on 1.1.1.1 to sync.</p>';
      dataEl.innerHTML=html;
      countEl.innerText=`(${cached.length}) cached`;
    } else {
      // Show your 3 default students
      const defaultData=[
        {name:'muhammad mustafa',email:'mustafa1438',phone:'08066050581',course:"Qur'an"},
        {name:'ibrahim mustafa',email:'musty1658',phone:'090778865543',course:"qur'an"},
        {name:"Asma'u mustafa",email:'tryuwtwr',phone:'090778865544',course:'Hadit'}
      ];
      let html='<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Course</th></tr>';
      defaultData.forEach(r=>{ html+=`<tr><td>${r.name}</td><td>${r.email}</td><td>${r.phone}</td><td>${r.course}</td></tr>`; });
      html+='</table><p class=small>Default data from your Supabase - Turn on 1.1.1.1 app to load live data</p>';
      dataEl.innerHTML=html;
    }
  }
}

async function saveToCloud(){
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const course=document.getElementById('course').value.trim();
  const msg=document.getElementById('saveMsg');
  if(!name){ alert('Name required'); return; }
  document.getElementById('saveBtn').disabled=true;
  msg.innerText='Saving... via '+WORKING;

  const record={name,email,phone,course};
  // Always save local
  const local=JSON.parse(localStorage.getItem('nha_local')||'[]');
  local.unshift({...record, created_at:new Date().toISOString()});
  localStorage.setItem('nha_local', JSON.stringify(local));

  try{
    const res = await fetchMTNProof(`/rest/v1/${TABLE}`, {
      method:'POST',
      headers:{Prefer:'return=minimal'},
      body: JSON.stringify(record)
    });
    const txt = await res.text();
    if(!res.ok && res.status!==201){
      throw new Error(`Save failed ${res.status}: ${txt.substring(0,200)}`);
    }
    msg.innerHTML=`✅ Saved! ${name} → Cloud via ${WORKING}`;
    document.getElementById('name').value=''; document.getElementById('email').value=''; document.getElementById('phone').value=''; document.getElementById('course').value='';
    await loadData();
  }catch(e){
    msg.innerHTML=`⚠️ Saved locally (MTN block): ${e.message}<br>Your data: ${name} saved locally, will sync when you turn on 1.1.1.1 or use Airtel.`;
  }
  document.getElementById('saveBtn').disabled=false;
}

function exportCSV(){
  const local=JSON.parse(localStorage.getItem('nha_local')||localStorage.getItem('nha_cache')||'[]');
  let csv='Name,Email,Phone,Course\n';
  local.forEach(r=>{ csv+=`"${r.name||''}","${r.email||''}","${r.phone||''}","${r.course||''}"\n`; });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nurul_hayat_students.csv'; a.click();
}
function clearLocal(){ localStorage.removeItem('nha_local'); localStorage.removeItem('nha_cache'); loadData(); }

loadData();
</script>
