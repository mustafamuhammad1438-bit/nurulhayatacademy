<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Nurul Hayat Academy 2017 | Firebase MTN Fixed</title>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>
body{font-family:Arial,sans-serif;background:#f5f7fb;margin:0}
.header{background:#039be5;color:white;text-align:center;padding:14px;font-weight:bold}
.container{max-width:720px;margin:15px auto;padding:0 12px}
.card{background:white;border-radius:8px;padding:14px;margin-bottom:12px;box-shadow:0 1px 3px rgba(0,0,0,.1)}
.input{width:100%;padding:11px;border:1px solid #ddd;border-radius:6px;margin-bottom:10px;box-sizing:border-box}
.btn{width:100%;padding:12px;background:#16a34a;color:white;border:none;border-radius:24px;font-weight:bold;cursor:pointer}
.badge-ok{background:#dcfce7;border:2px solid #16a34a;color:#166534;padding:10px;border-radius:6px;margin-bottom:10px;font-weight:bold}
.badge-warn{background:#fffbeb;border:2px solid #f59e0b;padding:10px;border-radius:6px;margin-bottom:10px}
table{width:100%;border-collapse:collapse;font-size:13px}
th,td{border:1px solid #eee;padding:6px;text-align:left}
th{background:#e1f5fe}
.small{font-size:11px;color:#666}
</style>
</head>
<body>
<div class="header">Nurul Hayat Academy 2017 | ✅ Firebase - MTN 100% Works</div>
<div class="container">

<div id="status" class="badge-warn">Connecting to Firebase (Google) - MTN never blocks Google...</div>

<div class="card">
<input id="name" class="input" placeholder="Name">
<input id="email" class="input" placeholder="Email">
<input id="phone" class="input" placeholder="Phone">
<input id="course" class="input" placeholder="Course">
<button id="saveBtn" class="btn" onclick="saveStudent()">Save Student</button>
<p id="saveMsg" class="small"></p>
</div>

<div class="card">
<h3 style="margin:0 0 8px 0">Students Data <span id="count"></span> <span class="small" style="color:#039be5">🔥 Firebase Live</span></h3>
<div id="data">Loading...</div>
<button onclick="loadData()" style="margin-top:8px">Refresh</button>
<button onclick="exportCSV()" style="margin-top:8px">Export CSV</button>
<button onclick="clearDup()" style="margin-top:8px;background:#fef3c7">Remove Duplicates</button>
</div>

</div>

<script>
// YOUR REAL FIREBASE CONFIG - from screenshot
const firebaseConfig = {
  apiKey: "AIzaSyDLz44912m33s8jsCGB1db4iw3PkTBKTb8",
  authDomain: "nurulhayat2017-d0f06.firebaseapp.com",
  projectId: "nurulhayat2017-d0f06",
  storageBucket: "nurulhayat2017-d0f06.firebasestorage.app",
  messagingSenderId: "378848485167",
  appId: "1:378848485167:web:8dc6fc48dcfb51475d4bda"
};

let db = null;
try{
  firebase.initializeApp(firebaseConfig);
  db = firebase.firestore();
  console.log("Firebase ready", firebaseConfig.projectId);
}catch(e){
  console.error("Firebase init error", e);
  document.getElementById('status').innerHTML = "❌ Firebase init error: "+e.message+"<br>Create Firestore Database first: Build → Firestore → Create → test mode";
}

async function loadData(){
  const dataEl=document.getElementById('data');
  const statusEl=document.getElementById('status');
  const countEl=document.getElementById('count');
  if(!db){
    statusEl.className='badge-warn';
    statusEl.innerHTML='⚠️ Create Firestore Database first: Firebase Console → Build → Firestore Database → Create → Start in test mode → eur3 → Enable, then refresh.';
    const local = JSON.parse(localStorage.getItem('nha_local')||'[]');
    if(local.length){
      let html='<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Course</th></tr>';
      local.forEach(r=>{ html+=`<tr><td>${r.name||''}</td><td>${r.email||''}</td><td>${r.phone||''}</td><td>${r.course||''}</td></tr>`; });
      html+='</table><p class=small>Local cache</p>';
      dataEl.innerHTML=html;
    }
    return;
  }
  try{
    statusEl.className='badge-warn';
    statusEl.innerHTML='⏳ Loading from Firebase (Google) - MTN-proof...';
    const snap = await db.collection('students').orderBy('created_at','desc').limit(100).get();
    let data=[];
    snap.forEach(doc=> data.push({id:doc.id, ...doc.data()}));
    
    // If no Firebase data, show old Supabase 3 students + local cache and migrate them
    if(data.length===0){
      const local = JSON.parse(localStorage.getItem('nha_local')||'[]');
      const defaults = [
        {name:'muhammad mustafa', email:'mustafa1438', phone:'08066050581', course:"Qur'an", created_at:new Date().toISOString()},
        {name:'ibrahim mustafa', email:'musty1658', phone:'090778865543', course:"qur'an", created_at:new Date().toISOString()},
        {name:"Asma'u mustafa", email:'tryuwtwr', phone:'090778865544', course:'Hadit', created_at:new Date().toISOString()}
      ];
      const source = local.length ? local : defaults;
      // migrate to firebase
      for(let r of source){
        try{ await db.collection('students').add(r); }catch(e){}
      }
      // reload
      const snap2 = await db.collection('students').orderBy('created_at','desc').limit(100).get();
      data=[];
      snap2.forEach(doc=> data.push({id:doc.id, ...doc.data()}));
    }

    // Dedup
    const map=new Map();
    data.forEach(r=>{
      const k=`${r.name}-${r.email}-${r.phone}`.toLowerCase();
      if(!map.has(k)) map.set(k,r);
    });
    const dedup=Array.from(map.values());
    localStorage.setItem('nha_local', JSON.stringify(dedup));

    statusEl.className='badge-ok';
    statusEl.innerHTML=`✅ Firebase Connected! ${dedup.length} students - Works on MTN without 1.1.1.1! Project: ${firebaseConfig.projectId}`;
    countEl.innerText=`(${dedup.length})`;
    
    let html='<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Course</th></tr>';
    dedup.forEach(r=>{ html+=`<tr><td>${r.name||''}</td><td>${r.email||''}</td><td>${r.phone||''}</td><td>${r.course||''}</td></tr>`; });
    html+='</table>';
    dataEl.innerHTML=html;
  }catch(e){
    statusEl.className='badge-warn';
    if(e.message.includes('FAILED_PRECONDITION') || e.message.includes('firestore') || e.message.includes('not-found')){
      statusEl.innerHTML=`⚠️ Firestore not created yet. Go to Firebase Console → Build → Firestore Database → Create database → Start in test mode → eur3 → Enable, then refresh here. Error: ${e.message}`;
    } else {
      statusEl.innerHTML=`❌ Firebase error: ${e.message}<br>Check Firestore Rules = test mode: allow read, write: if true`;
    }
    const local = JSON.parse(localStorage.getItem('nha_local')||'[]');
    let html='<table><tr><th>Name</th><th>Email</th><th>Phone</th><th>Course</th></tr>';
    local.forEach(r=>{ html+=`<tr><td>${r.name||''}</td><td>${r.email||''}</td><td>${r.phone||''}</td><td>${r.course||''}</td></tr>`; });
    html+='</table>';
    document.getElementById('data').innerHTML=html;
    document.getElementById('count').innerText=`(${local.length}) cached`;
  }
}

async function saveStudent(){
  const name=document.getElementById('name').value.trim();
  const email=document.getElementById('email').value.trim();
  const phone=document.getElementById('phone').value.trim();
  const course=document.getElementById('course').value.trim();
  const msg=document.getElementById('saveMsg');
  if(!name){ alert('Name required'); return; }
  document.getElementById('saveBtn').disabled=true;
  msg.innerText='Saving to Firebase...';
  const record={name,email,phone,course,created_at:new Date().toISOString()};
  
  const local=JSON.parse(localStorage.getItem('nha_local')||'[]');
  local.unshift(record);
  localStorage.setItem('nha_local', JSON.stringify(local));

  try{
    if(!db) throw new Error('Firestore not ready - Create database first');
    await db.collection('students').add(record);
    msg.innerHTML=`✅ Saved! ${name} → Firebase - MTN fixed!`;
    document.getElementById('name').value=''; document.getElementById('email').value=''; document.getElementById('phone').value=''; document.getElementById('course').value='';
    await loadData();
  }catch(e){
    msg.innerHTML=`❌ ${e.message}<br>Saved locally, will sync after Firestore created.`;
    await loadData();
  }
  document.getElementById('saveBtn').disabled=false;
}

function exportCSV(){
  const local=JSON.parse(localStorage.getItem('nha_local')||'[]');
  let csv='Name,Email,Phone,Course\n';
  local.forEach(r=>{ csv+=`"${r.name||''}","${r.email||''}","${r.phone||''}","${r.course||''}"\n`; });
  const blob=new Blob([csv],{type:'text/csv'});
  const a=document.createElement('a'); a.href=URL.createObjectURL(blob); a.download='nurul_hayat_students.csv'; a.click();
}
function clearDup(){
  const local=JSON.parse(localStorage.getItem('nha_local')||'[]');
  const map=new Map();
  local.forEach(r=>{ const k=`${r.name}-${r.email}-${r.phone}`.toLowerCase(); if(!map.has(k)) map.set(k,r); });
  const dedup=Array.from(map.values());
  localStorage.setItem('nha_local', JSON.stringify(dedup));
  alert(`Removed duplicates! ${local.length} → ${dedup.length}`);
  loadData();
}

loadData();
</script>
</body>
</html>
